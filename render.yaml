# Render Blueprint: creates the API service from the backend/ folder.
# Values marked "sync: false" are asked for in the Render dashboard on first deploy.
services:
  - type: web
    name: cyberguard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
